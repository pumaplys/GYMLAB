name: CI

# Se ejecuta en cada pull request y en cada push a main.
#
# El objetivo declarado de este workflow es que ningun cambio pueda entrar en
# main sin que el aislamiento entre gimnasios siga demostrado. Es la mitigacion
# del riesgo numero 1 de docs/01-arquitectura.md: una fuga de datos entre
# clientes no es un bug, es el final del producto.
on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo sobre la misma rama cancela la ejecucion anterior: no tiene
# sentido gastar minutos verificando un commit ya superado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificacion
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # PostgreSQL real, no un mock ni una base en memoria.
    #
    # Los tests de aislamiento comprueban politicas RLS, roles de base de datos
    # y permisos: nada de eso existe fuera de Postgres. Un mock solo probaria
    # que el mock funciona.
    #
    # La configuracion replica docker-compose.yml a proposito, incluido que
    # `gymlab` sea superusuario: es lo que hace que la comprobacion "la conexion
    # de la aplicacion NO puede saltarse RLS" tenga sentido.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gymlab
          POSTGRES_PASSWORD: gymlab
          POSTGRES_DB: gymlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymlab -d gymlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Dos conexiones, y no son intercambiables (ADR-002).
      #   propietario -> migraciones, politicas y colas. Ignora RLS.
      #   aplicacion  -> API y tests. Sujeto a RLS.
      DATABASE_URL: postgresql://gymlab:gymlab@localhost:5432/gymlab
      DATABASE_URL_APP: postgresql://gymlab_app:gymlab_app@localhost:5432/gymlab
      APP_DB_PASSWORD: gymlab_app

      # Valores de usar y tirar: esta base de datos vive lo que dura el job.
      # Los secretos de verdad nunca pasan por aqui.
      AUTH_SECRET: ci-secret-de-usar-y-tirar-mas-de-32-caracteres
      # Semilla del QR de acceso. DISTINTA de AUTH_SECRET tambien aqui: si en CI
      # compartieran valor, nada delataria el dia que el codigo las confundiera.
      ACCESS_TOKEN_SECRET: ci-semilla-de-acceso-de-usar-y-tirar-32-caracteres
      PLATFORM_INVITE_CODE: ci-platform-code
      API_URL: http://localhost:3001
      API_PORT: '3001'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # La misma version con la que se desarrolla. TypeScript 6 y pg-boss 12
          # exigen Node >= 22.12.
          node-version: '24'

      # La version de pnpm sale del campo `packageManager` del package.json, con
      # su hash. No hay forma de que CI use una distinta de la local.
      - name: Habilitar pnpm
        run: corepack enable pnpm

      - name: Instalar dependencias
        # --frozen-lockfile: si el lockfile no cuadra con los package.json, el
        # job falla en lugar de resolver versiones distintas en silencio.
        run: pnpm install --frozen-lockfile

      - name: Migraciones, politicas RLS y colas
        # Un solo comando encadena los tres pasos, en el unico orden que
        # funciona: las tablas antes que sus politicas, y pg-boss al final
        # porque hace DDL que el rol de la aplicacion no puede ejecutar.
        run: pnpm db:migrate

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        # Incluye los dos que sostienen el producto:
        #   - aislamiento entre gimnasios (RLS)
        #   - abuso de autenticacion: tokens reutilizados, caducados,
        #     revocados, manipulados y escalada de privilegios
        #
        # `--concurrency=1` (en el script raiz): las baterias de db y api
        # comparten una sola base de datos, asi que ejecutarlas en paralelo es
        # una carrera latente. Los builds ya son acierto de cache aqui, asi que
        # serializar no cuesta tiempo.
        run: pnpm test

      # ---------------------------------------------------------------- D0
      #
      # La red de seguridad de Design 2.0. Mide el panel con Chrome sin ventana
      # en cuatro anchos y con los cuatro roles.
      #
      # Se sirve TODO desde la API —el panel incluido, que es como funciona en
      # produccion— asi que no hace falta un segundo proceso: `pnpm build` ya
      # dejo `apps/web/out` y `montarPanel` lo sirve bajo el mismo origen.
      #
      # `--ci` solo mira las reglas ya cerradas. Las que representan deuda
      # visual conocida —navegacion recortada, objetivos tactiles— se imprimen
      # en el informe pero NO tumban main: documentarlas bien no puede ser lo
      # que rompa la rama. Cada una tiene su fase de cierre escrita en
      # apps/web/auditoria/reglas.mjs.
      - name: Arrancar la API con el panel
        run: |
          node apps/api/dist/main.js &
          echo $! > /tmp/api.pid
          for i in $(seq 1 40); do
            curl -sf http://localhost:3001/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3001/health

      - name: D0 — auditoria visual
        run: pnpm --filter @gymlab/web auditar --ci

      - name: Parar la API
        if: always()
        run: kill "$(cat /tmp/api.pid)" 2>/dev/null || true

      # Diagnostico para cuando un fallo no se reproduce en local. Un
      # ECONNRESET desde el cliente no dice nada; el log del servidor sí:
      # reinicios, cortes de conexion o limites alcanzados.
      - name: Log de PostgreSQL si algo falla
        if: failure()
        run: docker logs "$(docker ps -aqf ancestor=postgres:16-alpine | head -1)" 2>&1 | tail -100

      - name: Estado de las conexiones si algo falla
        if: failure()
        run: |
          PGPASSWORD=gymlab psql -h localhost -U gymlab -d gymlab -c \
            "SELECT count(*) AS conexiones, (SELECT setting FROM pg_settings WHERE name='max_connections') AS maximo FROM pg_stat_activity WHERE datname='gymlab';" \
            || echo "no se pudo consultar"
