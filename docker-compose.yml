services:
  postgres:
    image: postgres:16-alpine
    container_name: gymlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymlab
      POSTGRES_PASSWORD: gymlab
      POSTGRES_DB: gymlab
    ports:
      - '5432:5432'
    volumes:
      - gymlab-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gymlab -d gymlab']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gymlab-pgdata:
